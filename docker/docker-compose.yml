version: '3.8'

services:
  marketing-automation-engine:
    build:
      # Workspace root, not just this repo - needed to reach the
      # unkey-auth/ab-testing sibling packages the Dockerfile copies in
      # (see its own comment for why). Run `docker compose -f
      # docker/docker-compose.yml build` from marketing-automation-engine/
      # as before; this context path is relative to this compose file's
      # own location either way.
      context: ../..
      dockerfile: marketing-automation-engine/docker/Dockerfile
    container_name: marketing-automation-engine
    ports:
      - "8039:8039"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/marketing
      - REDIS_URL=redis://redis:6379/4
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - DEFAULT_SENDER_EMAIL=${DEFAULT_SENDER_EMAIL:-marketing@company.com}
      - TWITTER_API_KEY=${TWITTER_API_KEY}
      - TWITTER_API_SECRET=${TWITTER_API_SECRET}
      - TWITTER_ACCESS_TOKEN=${TWITTER_ACCESS_TOKEN}
      - TWITTER_ACCESS_SECRET=${TWITTER_ACCESS_SECRET}
      - LINKEDIN_API_KEY=${LINKEDIN_API_KEY}
      - LINKEDIN_API_SECRET=${LINKEDIN_API_SECRET}
      - UNKEY_ROOT_KEY=${UNKEY_ROOT_KEY}
      - UNKEY_API_ID=${UNKEY_API_ID}
      - UNKEY_BASE_URL=${UNKEY_BASE_URL:-https://api.unkey.com/v2}
      - DEBUG=${DEBUG:-false}
      - FUNNEL_AUTOMATION_URL=http://funnel-automation-engine:8000
      - CONTENT_ENGINE_URL=http://content-engine:8040
      - ANALYTICS_ENGINE_URL=http://analytics-engine:8042
    # No depends_on here - postgres/redis moved to shared infra
    # (deploy/docker-compose.infra.yml), a different compose project.
    # Bring that up first: deploy/03-build-and-up.sh infra-up
    networks:
      - os42-shared
    restart: unless-stopped

networks:
  os42-shared:
    external: true
